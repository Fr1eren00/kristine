<index.html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бурлуцкой Кристине Валентиновне</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      font-size: clamp(1.4rem, 5vw, 3rem);
      margin: 0 0 2rem;
      text-align: center;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
      letter-spacing: 1px;
      line-height: 1.25;
      z-index: 2;
    }

    #compliment {
      font-size: clamp(1.3rem, 4vw, 2rem);
      text-align: center;
      max-width: 90%;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      z-index: 2;
      min-height: 3em;
      line-height: 1.4;
      color: #ffeb3b;
      text-shadow: 0 0 15px rgba(255, 235, 59, 0.6);
    }

    #compliment.show {
      opacity: 1;
      transform: translateY(0);
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>
  <h1>Бурлуцкой Кристине Валентиновне</h1>
  <div id="compliment"></div>
  <canvas id="fireworks"></canvas>

  <script>
    const compliments = [
      "Ты красивая", "Ты умная", "Ты добрая", "Ты классная", "Ты милая",
      "Ты весёлая", "Ты обаятельная", "Ты симпатичная", "Ты хорошая", "Ты заботливая",
      "Ты честная", "Ты смелая", "Ты сильная", "Ты нежная", "Ты женственная",
      "Ты стильная", "Ты внимательная", "Ты искренняя", "Ты светлая", "Ты тёплая",
      "Ты надёжная", "Ты трудолюбивая", "Ты щедрая", "Ты терпеливая", "Ты воспитанная",
      "Ты интересная", "Ты умница", "Ты красотка", "Ты молодец", "Ты золотая",
      "Ты лучшая", "Ты особенная", "Ты неповторимая", "Ты обворожительная", "Ты привлекательная",
      "Ты очаровательная", "Ты рассудительная", "Ты спокойная", "Ты уверенная", "Ты целеустремлённая",
      "Ты ответственная", "Ты порядочная", "Ты открытая", "Ты жизнерадостная", "Ты утончённая",
      "Ты элегантная", "Ты общительная", "Ты понимающая", "Ты просто супер", "Ты самая классная"
    ];

    let currentIndex = 0;
    const complimentEl = document.getElementById('compliment');
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let particles = [];
    const gravity = 0.05;
    const friction = 0.98;

    function createFirework(x, y) {
      const count = 60;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 2;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          color: `hsl(${Math.random() * 360}, 100%, 60%)`,
          size: Math.random() * 3 + 1
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += gravity;
        p.vx *= friction;
        p.vy *= friction;
        p.alpha -= 0.015;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function animate() {
      updateParticles();
      drawParticles();
      requestAnimationFrame(animate);
    }

    animate();

    document.body.addEventListener('click', (e) => {
      const x = e.clientX || window.innerWidth / 2;
      const y = e.clientY || window.innerHeight / 2;

      createFirework(x, y);

      if (currentIndex < compliments.length) {
        complimentEl.classList.remove('show');
        setTimeout(() => {
          complimentEl.textContent = compliments[currentIndex];
          complimentEl.classList.add('show');
          currentIndex++;
        }, 100);
      } else {
        complimentEl.classList.remove('show');
        setTimeout(() => {
          complimentEl.textContent = "Ты — вишенка на торте! ❤️";
          complimentEl.classList.add('show');
        }, 100);
      }
    });

    window.addEventListener('load', () => {
      complimentEl.textContent = compliments[currentIndex];
      complimentEl.classList.add('show');
      currentIndex++;
    });
  </script>
</body>
</html>
